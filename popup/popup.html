<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tıbbi Not Defteri</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-logo">
        <span class="popup-logo-icon">🩺</span>
        <span class="popup-logo-text">Tıbbi Not Defteri</span>
      </div>
      <div class="popup-header-right">
        <button class="popup-open-btn" id="openNotebook" title="Defteri Aç">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
          Defteri Aç
        </button>
        <span class="popup-date" id="currentDate"></span>
      </div>
    </div>

    <!-- Aç/Kapa -->
    <div class="popup-power" id="popupPower">
      <div class="popup-power-info">
        <span class="popup-power-dot" id="powerDot"></span>
        <span class="popup-power-label" id="powerLabel">Uzantı Aktif</span>
      </div>
      <label class="popup-switch">
        <input type="checkbox" id="enableToggle" checked>
        <span class="popup-switch-slider"></span>
      </label>
    </div>

    <!-- Stats -->
    <div class="popup-stats">
      <div class="popup-stat">
        <span class="popup-stat-value" id="todayCount">0</span>
        <span class="popup-stat-label">Bugün</span>
      </div>
      <div class="popup-stat-divider"></div>
      <div class="popup-stat">
        <span class="popup-stat-value" id="totalCount">0</span>
        <span class="popup-stat-label">Toplam</span>
      </div>
      <div class="popup-stat-divider"></div>
      <div class="popup-stat">
        <span class="popup-stat-value" id="starredCount">0</span>
        <span class="popup-stat-label">Yıldızlı</span>
      </div>
    </div>

    <!-- Quick Note -->
    <div class="popup-quick-note">
      <textarea id="quickNoteInput" placeholder="Hızlı not ekle..." rows="2"></textarea>
      <button class="popup-quick-note-btn" id="quickNoteBtn">
        <span>📝</span> Kaydet
      </button>
    </div>

    <!-- Recent Notes -->
    <div class="popup-section">
      <div class="popup-section-title">Son Notlar</div>
      <div class="popup-notes-list" id="recentNotes">
        <div class="popup-empty">Henüz not yok</div>
      </div>
    </div>

    <!-- Shortcuts -->
    <div class="popup-shortcuts">
      <div class="popup-shortcut">
        <kbd>Alt+Q</kbd>
        <span>Seçili metni aktar</span>
      </div>
      <div class="popup-shortcut">
        <kbd>Alt+1</kbd>
        <span>AI yanıtını paragraflara böl</span>
      </div>
      <div class="popup-shortcut">
        <kbd>Alt+2</kbd>
        <span>AI yanıtını tümüyle aktar</span>
      </div>
      <div class="popup-shortcut">
        <kbd>Alt+3</kbd>
        <span>Okunan cevabı sorusuyla aktar</span>
      </div>
    </div>

    <!-- Tema & Ayarlar -->
    <div class="popup-footer">
      <div class="popup-theme-toggle" id="popupThemeToggle">
        <button class="popup-theme-btn active" data-theme="dark">🌙 Koyu</button>
        <button class="popup-theme-btn" data-theme="light">☀️ Açık</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
